name: docktkinase 
channels:
  - conda-forge
  - bioconda         # hmmer / hhsuite / kalign2
  - pytorch          # official CUDA-enabled PyTorch builds
dependencies:
  # Core runtime
  - python =3.10
  - pip
  - cudatoolkit =11.8        # ↔ matches PyTorch build
  - pytorch =2.2.*           # cu118 build
  - torchvision =0.17.*
  - torchaudio =2.2.*

  # Scientific stack
  - numpy >=1.26,<2.0
  - scipy >=1.12
  - pandas >=2.1
  - scikit-learn >=1.5
  - matplotlib >=3.9
  - pyarrow >=14.0.1

  # Bio / MSA toolchain
  - openmm >=8.1
  - hmmer =3.4          # binary, Python-agnostic
  - hhsuite =3.3.0
  - kalign2 =2.04
  - rdkit >=2024.3.5

  # Misc utilities
  - einops
  - omegaconf
  - hydra-core
  - tqdm
  - requests
  - urllib3
  - zipp
  - networkx >=2.8
  - pandas
  - pytest

  # --- Everything below comes from PyPI ---
  - pip:
      # deep-learning ecosystem
      - deepspeed >=0.14
      - pytorch_lightning >=2.2
      - torchinfo >=1.8
      - torch-optimizer
      # Graph & geometric
      - torch-geometric ==2.5.2
      # NLP / datasets
      - transformers >=4.38
      - datasets >=2.13.1
      - evaluate >=0.4.0
      # Chemistry / ML
      - selfies >=2.1.0
      - xgboost ==1.6.2
      - umap-learn
      - mordred
      # Original extras
      - biopython >=1.83
      - ml-collections >=0.1.2
      - dm-tree ==0.1.9
      - wandb
      - git+https://github.com/NVIDIA/dllogger.git
