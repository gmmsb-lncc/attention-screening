name: cmadti-cuda
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26
  - pandas=2.2.3
  - scikit-learn=1.5.2
  - rdkit=2024.09.6
  - pyyaml
  - tqdm
  - yacs
  - prettytable
  # Install this with conda before pip installs PyTorch.  DGL's conda package
  # also depends on networkx; leaving it to pip first causes ClobberError when
  # conda subsequently tries to claim the same site-packages paths.
  - networkx=3.4.2
