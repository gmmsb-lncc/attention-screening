# BAN-Kinase-Network Configuration
# Variant: ESM-2 (650M) + MoLFormer-XL + CLS-guided Attention Pooling
#
# Differences from GraphBAN baseline (GraphBAN/configs/kinase_inductive.yaml):
#   - Protein encoder: ESM-2 650M instead of ESM-1b (same 1280-d dim)
#   - Drug encoder:    MoLFormer-XL 768-d instead of ChemBERTa 384-d
#   - Pooling:         CLS-guided attention pooling instead of mean/CLS-token
#   - DRUG.EMB_DIM:    768 (MoLFormer) vs 384 (ChemBERTa)
#   - DA.RANDOM_DIM:   512 updated to match larger drug embedding
#
# All other hyperparameters kept identical to GraphBAN baseline for fair
# comparison (same LR, batch size, max epochs, DA method, etc).

SOLVER:
  BATCH_SIZE: 32
  MAX_EPOCH: 50
  LR: 1e-5
  DA_LR: 5e-5
  NUM_WORKERS: 0
  SEED: 42

DRUG:
  NODE_IN_FEATS: 75
  PADDING: True
  HIDDEN_LAYERS: [128, 128, 128]
  NODE_IN_EMBEDDING: 128
  MAX_NODES: 290

PROTEIN:
  NUM_FILTERS: [128, 128, 128]
  KERNEL_SIZE: [3, 6, 9]
  EMBEDDING_DIM: 128
  PADDING: True

BCN:
  HEADS: 2

DECODER:
  NAME: "MLP"
  IN_DIM: 256
  HIDDEN_DIM: 512
  OUT_DIM: 128
  BINARY: 2

RESULT:
  OUTPUT_DIR: "./results/kinase_bkn"
  SAVE_MODEL: True

DA:
  TASK: True
  USE: True
  METHOD: "CDAN"
  USE_ENTROPY: False
  RANDOM_LAYER: True
  ORIGINAL_RANDOM: True
  RANDOM_DIM: 512        # increased from 256 to accommodate 768-d drug embeddings
  INIT_EPOCH: 10
  LAMB_DA: 1

COMET:
  WORKSPACE: "ban-kinase-network"
  PROJECT_NAME: "BKN_ESM2_MoLFormer_AttnPool"
  USE: False
  TAG: null
