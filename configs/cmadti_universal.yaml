model:
  drug_node_in_feats: 75
  drug_node_embedding: 128
  drug_hidden_layers: [128, 128, 1280]
  max_drug_nodes: 310
  chemberta_feature_dim: 768
  protein_feature_dim: 1280
  # Publication Table 3 selected 2 heads.  The public repository defaults to
  # 8, but the paper is the primary source for canonical model fidelity.
  attention_heads: 2
  attention_dropout: 0.2
  decoder_hidden_dim: 512
  decoder_out_dim: 128
training:
  epochs: 100
  batch_size: 64
  num_workers: 0
  learning_rate: 0.00005
encoders:
  esm_model: facebook/esm2_t33_650M_UR50D
  esm_revision: 08e4846e537177426273712802403f7ba8261b6c
  esm_max_length: 512
  chemberta_model: seyonec/ChemBERTa-zinc-base-v1
  chemberta_revision: 761d6a18cf99db371e0b43baf3e2d21b3e865a20
  chemberta_max_length: 512
protocol:
  model_selection: validation_auroc
  # The paper states that the decision threshold is selected on validation and
  # then applied to test, but does not name the optimization metric.  MCC is the
  # benchmark-wide operating-point rule used for every committee model.
  threshold_selection: validation_mcc
  seeds: [42, 123, 456, 789, 1024]
publication:
  doi: 10.3389/fbinf.2026.1861685
  source_priority: publication_then_official_code
  canonical_deviations:
    max_drug_nodes: "310 instead of 290 to retain every molecule in the fixed benchmark splits"
    threshold_metric: "validation MCC; the publication specifies validation scope but not the metric"
    early_stopping: "best validation-AUROC checkpoint over 100 epochs; publication does not report patience"
