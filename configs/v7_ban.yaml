# ============================================================================
# DT-Kinase Benchmark — v7_ban (BAN head variant)
# ============================================================================
# Identical to configs/v7.yaml except level4_cnn.variant: v8 (BAN).
#
# Motivation: cross-dataset matrix showed DT-Kinase v7 lagged DrugBAN and
# GraphBAN by ~0.05 MCC on off-diagonal transfer. Strongest hypothesis is
# the projection bottleneck in v7's interaction heads (D_p=320 and
# D_l=768 are both squashed to head_dim=32 before dot-product). BAN
# (variant=v8) uses full-dim W_k in R^{D_p × D_l} per head — no
# bottleneck, matching DrugBAN/GraphBAN's bilinear interaction.
#
# Cost: W_ban adds ~1.96M params (K=8 x D_p=320 x D_l=768) vs ~278K for
# v7's projection heads. Same CNN + HierPool + classifier downstream.
#
# Output dir segregated so v7 results are not overwritten.
#
# Usage:
#   V7_CONFIG=configs/v7_ban.yaml CORPUS=non_human SEEDS="42" \
#       bash scripts/v8/run_v7_yaml.sh
# ============================================================================

dataset: non_human
embedding: 8M
levels: 4cnn
epochs: 500
model_selection_metric: mcc

output_root: results/benchmark_ban_{dataset}_{embedding}

level4_cnn:
  variant: v8   # <-- BAN head; was v7
  num_heads: 8
  head_dim: 32  # unused in v8 variant (W_ban replaces projections)
  channels: 64
  batch_size: 128

  dropout: 0.35
  weight_decay: 0.04

  double: false
  no_amp: true
  deterministic: false

  patience: 5
  focal: true
  focal_gamma: 2.0

  adapter:
    enabled: true
    layers: 1
    self_attn: true
    lr_mult: 5.0
    prot_dim: 256
    lig_dim: 512

  calibration:
    platt: true
    temperature: false

  contrastive_weight: 0.0
  contrastive_dim: 128
  cosine_feat: false
  cosine_sim: false

  mlp_head: false

  label_smooth: 0.0
  mixup_alpha: 0.0

  train_to_zero: false
  train_to_zero_thr: 0.01

  checkpoint_every: 10

rigor:
  enforce: true
  require_train_selection: true
  strict_level_completeness: true

gate:
  target_test_mcc: 0.52
  max_test_mcc_std: 0.08

suppress_warnings: true
